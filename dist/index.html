<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Mystery of Fire — Grade 6 interactive science experience on the role of air in burning." />
    <title>The Mystery of Fire · Grade 6 Science</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />
    
    
    
        <link rel="stylesheet" href="./assets/style.css" />
    <script src="./assets/app.js" defer></script>
  </head>
  <body>
    <div id="app" class="app">
      <canvas id="atmosphere" class="atmosphere" aria-hidden="true"></canvas>

      <header class="topbar" role="banner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div class="brand-text">
            <p class="brand-kicker">Grade 6 Science</p>
            <h1 class="brand-title">The Mystery of Fire</h1>
          </div>
        </div>
        <nav class="progress" id="progress" aria-label="Lesson chapters"></nav>
        <div class="top-actions">
          <button type="button" class="icon-btn" id="mute-btn" aria-pressed="false" aria-label="Mute sound">
            <span class="icon-sound" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <main id="stage" class="stage" role="main" aria-live="polite"></main>

      <footer class="bottombar" role="contentinfo">
        <button type="button" class="nav-btn" id="back-btn" disabled>Back</button>
        <p class="chapter-label" id="chapter-label"></p>
        <button type="button" class="nav-btn nav-btn-primary" id="next-btn">Continue</button>
      </footer>

      <div id="gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
        <div class="gate-inner">
          <p class="gate-kicker">Interactive Science Experience</p>
          <h2 id="gate-title" class="gate-title">The Mystery of Fire</h2>
          <p class="gate-sub">What does a flame need to keep burning?</p>
          <button type="button" class="gate-cta" id="enter-btn">Begin the Investigation</button>
          <p class="gate-note">Best experienced with sound. You can mute anytime.</p>
        </div>
      </div>
    </div>

    

    
  </body>
</html>
